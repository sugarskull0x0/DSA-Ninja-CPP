// ===== PLAYGROUNDS: TREES / GRAPHS =====
function layoutTree(root){
  if(!root)return [];
  const positions=[];
  let idx=0;
  function inorderPos(n,depth){
    if(!n)return;
    inorderPos(n.l,depth+1);
    n._x=idx++;n._d=depth;
    positions.push(n);
    inorderPos(n.r,depth+1);
  }
  inorderPos(root,0);
  return positions;
}
function drawTreeSVG(svgEl,root,W,H,hl){
  hl=hl||{};
  const nodes=layoutTree(root);
  if(nodes.length===0){svgEl.innerHTML='<text x="50%" y="50%" fill="#8b949e" text-anchor="middle">Empty tree</text>';return;}
  const xMax=Math.max(...nodes.map(n=>n._x));
  const dMax=Math.max(...nodes.map(n=>n._d));
  const pad=40;
  nodes.forEach(n=>{
    n.px=xMax===0?W/2:pad+(n._x/xMax)*(W-2*pad);
    n.py=pad+(n._d/(Math.max(dMax,1)))*(H-2*pad);
  });
  let edges='';
  nodes.forEach(n=>{
    if(n.l){edges+=`<line x1="${n.px}" y1="${n.py}" x2="${n.l.px}" y2="${n.l.py}" class="tree-edge"/>`;}
    if(n.r){edges+=`<line x1="${n.px}" y1="${n.py}" x2="${n.r.px}" y2="${n.r.py}" class="tree-edge"/>`;}
  });
  let nodesHtml=nodes.map(n=>{
    const cls=hl[n.v]==='visit'?'tree-node visit':(hl[n.v]==='found'?'tree-node found':'tree-node');
    return `<g class="${cls}"><circle cx="${n.px}" cy="${n.py}" r="18"/><text x="${n.px}" y="${n.py}">${n.v}</text></g>`;
  }).join('');
  svgEl.innerHTML=edges+nodesHtml;
}

function bstPg(){
  const viz=$('bst-viz').querySelector('svg'),status=$('bst-status'),val=$('bst-val');
  let root=null;
  function insert(node,v){if(!node)return {v,l:null,r:null};if(v<node.v)node.l=insert(node.l,v);else if(v>node.v)node.r=insert(node.r,v);return node;}
  function search(node,v){if(!node)return null;if(node.v===v)return node;return v<node.v?search(node.l,v):search(node.r,v);}
  function minN(n){while(n.l)n=n.l;return n;}
  function remove(node,v){
    if(!node)return null;
    if(v<node.v)node.l=remove(node.l,v);
    else if(v>node.v)node.r=remove(node.r,v);
    else{
      if(!node.l)return node.r;
      if(!node.r)return node.l;
      const s=minN(node.r);node.v=s.v;node.r=remove(node.r,s.v);
    }
    return node;
  }
  function reset(){root=null;for(const v of [50,30,70,20,40,60,80,10,25])root=insert(root,v);draw();}
  function draw(hl){drawTreeSVG(viz,root,700,260,hl);}
  reset();
  $('bst-ins').addEventListener('click',async()=>{
    const v=parseInt(val.value);if(isNaN(v))return;
    let cur=root,path=[];
    while(cur){path.push(cur);if(v===cur.v){status.textContent='Value exists.';return;}cur=v<cur.v?cur.l:cur.r;}
    for(const n of path){draw({[n.v]:'visit'});await sleep(350);}
    root=insert(root,v);draw({[v]:'found'});
    status.innerHTML=`Inserted <span class="hl">${v}</span>`;
  });
  $('bst-find').addEventListener('click',async()=>{
    const v=parseInt(val.value);if(isNaN(v))return;
    let cur=root;
    while(cur){
      draw({[cur.v]:'visit'});await sleep(400);
      if(cur.v===v){draw({[cur.v]:'found'});status.innerHTML=`Found <span class="hl">${v}</span>`;confetti();return;}
      cur=v<cur.v?cur.l:cur.r;
    }
    draw();status.textContent=`${v} not found`;
  });
  $('bst-rm').addEventListener('click',()=>{
    const v=parseInt(val.value);if(isNaN(v))return;
    if(!search(root,v)){status.textContent='Not found';return;}
    root=remove(root,v);draw();status.innerHTML=`Deleted <span class="hl">${v}</span>`;
  });
  $('bst-reset').addEventListener('click',reset);
}

function traversalPg(){
  const viz=$('tr-viz').querySelector('svg'),status=$('tr-status'),speed=$('tr-speed');
  const root={v:1,l:{v:2,l:{v:4,l:null,r:null},r:{v:5,l:null,r:null}},r:{v:3,l:{v:6,l:null,r:null},r:{v:7,l:null,r:null}}};
  let running=false;
  function draw(hl){drawTreeSVG(viz,root,600,260,hl);}
  draw();
  async function run(order){
    if(running)return;running=true;
    const visited=[];const hl={};
    function pre(n){if(!n)return;visited.push(n.v);pre(n.l);pre(n.r);}
    function inO(n){if(!n)return;inO(n.l);visited.push(n.v);inO(n.r);}
    function post(n){if(!n)return;post(n.l);post(n.r);visited.push(n.v);}
    function bfs(){const q=[root];while(q.length){const x=q.shift();visited.push(x.v);if(x.l)q.push(x.l);if(x.r)q.push(x.r);}}
    if(order==='pre')pre(root);else if(order==='in')inO(root);else if(order==='post')post(root);else bfs();
    for(const v of visited){hl[v]='visit';draw({...hl});status.innerHTML=`Order: <span class="hl">${visited.slice(0,visited.indexOf(v)+1).join(' → ')}</span>`;await sleep(parseInt(speed.value));}
    confetti();running=false;
  }
  $('tr-pre').addEventListener('click',()=>run('pre'));
  $('tr-in').addEventListener('click',()=>run('in'));
  $('tr-post').addEventListener('click',()=>run('post'));
  $('tr-bfs').addEventListener('click',()=>run('bfs'));
  $('tr-reset').addEventListener('click',()=>{draw();status.textContent='Ready.';});
}

function heapPg(){
  const viz=$('hp-viz').querySelector('svg'),status=$('hp-status'),val=$('hp-val'),speed=$('hp-speed');
  let h=[50,30,40,10,20,25,15];
  function draw(hl){
    if(h.length===0){viz.innerHTML='<text x="50%" y="50%" fill="#8b949e" text-anchor="middle">Empty</text>';return;}
    const positions=[];const W=700,H=260,pad=40;
    const lvls=Math.floor(Math.log2(h.length))+1;
    for(let i=0;i<h.length;i++){
      const d=Math.floor(Math.log2(i+1));
      const lvlStart=(1<<d)-1;const lvlSize=1<<d;
      const pos=i-lvlStart;
      const x=pad+(pos+0.5)/lvlSize*(W-2*pad);
      const y=pad+(d/Math.max(lvls-1,1))*(H-2*pad);
      positions.push({x,y,v:h[i]});
    }
    let edges='';
    for(let i=0;i<h.length;i++){
      const l=2*i+1,r=2*i+2;
      if(l<h.length)edges+=`<line x1="${positions[i].x}" y1="${positions[i].y}" x2="${positions[l].x}" y2="${positions[l].y}" class="tree-edge"/>`;
      if(r<h.length)edges+=`<line x1="${positions[i].x}" y1="${positions[i].y}" x2="${positions[r].x}" y2="${positions[r].y}" class="tree-edge"/>`;
    }
    let nodes=positions.map((p,i)=>{
      const cls=hl&&hl[i]==='visit'?'tree-node visit':(hl&&hl[i]==='found'?'tree-node found':'tree-node');
      return `<g class="${cls}"><circle cx="${p.x}" cy="${p.y}" r="18"/><text x="${p.x}" y="${p.y}">${p.v}</text></g>`;
    }).join('');
    viz.innerHTML=edges+nodes;
  }
  draw();
  async function siftUp(i){
    while(i>0){
      const p=Math.floor((i-1)/2);
      draw({[i]:'visit',[p]:'visit'});
      await sleep(parseInt(speed.value));
      if(h[p]<h[i]){[h[p],h[i]]=[h[i],h[p]];draw({[i]:'found',[p]:'found'});await sleep(parseInt(speed.value));i=p;}
      else break;
    }
    draw();
  }
  async function siftDown(i){
    const n=h.length;
    while(true){
      const l=2*i+1,r=2*i+2;let lg=i;
      if(l<n&&h[l]>h[lg])lg=l;
      if(r<n&&h[r]>h[lg])lg=r;
      draw({[i]:'visit'});
      await sleep(parseInt(speed.value));
      if(lg===i)break;
      [h[i],h[lg]]=[h[lg],h[i]];draw({[i]:'found',[lg]:'found'});await sleep(parseInt(speed.value));i=lg;
    }
    draw();
  }
  $('hp-ins').addEventListener('click',async()=>{const v=parseInt(val.value);if(isNaN(v))return;h.push(v);draw({[h.length-1]:'found'});status.innerHTML=`Inserted <span class="hl">${v}</span>, sifting up...`;await sleep(parseInt(speed.value));await siftUp(h.length-1);status.textContent='Done.';});
  $('hp-ext').addEventListener('click',async()=>{if(h.length===0)return;const m=h[0];h[0]=h.pop();status.innerHTML=`Extracted <span class="hl">${m}</span>, sifting down...`;draw({0:'found'});await sleep(parseInt(speed.value));if(h.length)await siftDown(0);confetti();status.innerHTML=`Max was <span class="hl">${m}</span>`;});
  $('hp-reset').addEventListener('click',()=>{h=[50,30,40,10,20,25,15];draw();status.textContent='Reset.';});
}

const SAMPLE_GRAPH={
  n:7,
  pos:[{x:300,y:50},{x:150,y:130},{x:450,y:130},{x:80,y:230},{x:220,y:230},{x:400,y:230},{x:520,y:230}],

function drawGraph(svgEl,visited,current){
  const g=SAMPLE_GRAPH;visited=visited||{};

  for(let u=0;u<g.n;u++)for(const v of g.adj[u]){const k=Math.min(u,v)+'-'+Math.max(u,v);if(drawn.has(k))continue;drawn.add(k);edges+=`<line x1="${g.pos[u].x}" y1="${g.pos[u].y}" x2="${g.pos[v].x}" y2="${g.pos[v].y}" class="tree-edge"/>`;}

function graphTraversalPg(){

function drawDjGraph(svgEl,dist,visited,current){
  const g=DIJKSTRA_GRAPH;visited=visited||{};dist=dist||[];
  let edges='';
  for(const [u,v,w] of g.edges){

  }

    const d=dist[i]==null||dist[i]===Infinity?'∞':dist[i];
    nodes+=`<g class="${cls}"><circle cx="${g.pos[i].x}" cy="${g.pos[i].y}" r="20"/><text x="${g.pos[i].x}" y="${g.pos[i].y}">${i}</text></g>`;
    nodes+=`<text x="${g.pos[i].x}" y="${g.pos[i].y-30}" fill="#00e5ff" font-size="12" text-anchor="middle" font-weight="600">d=${d}</text>`;
  }

function dijkstraPg(){
  const viz=$('dj-viz').querySelector('svg'),status=$('dj-status'),src=$('dj-src'),speed=$('dj-speed');
  let steps=[],idx=0,running=false;
  function neighbors(u){const n=[];for(const [a,b,w] of DIJKSTRA_GRAPH.edges){if(a===u)n.push([b,w]);else if(b===u)n.push([a,w]);}return n;}
  function buildSteps(s){
    const n=DIJKSTRA_GRAPH.n;
    const dist=Array(n).fill(Infinity);dist[s]=0;
    const visited={};
    steps=[];
    steps.push({dist:[...dist],visited:{...visited},msg:`Initialize: dist[${s}]=0, others=∞`});
    while(true){
      let u=-1,best=Infinity;
      for(let i=0;i<n;i++)if(!visited[i]&&dist[i]<best){best=dist[i];u=i;}
      if(u===-1)break;
      visited[u]=true;
      steps.push({dist:[...dist],visited:{...visited},current:u,msg:`Pick node ${u} (d=${dist[u]})`});
      for(const [v,w] of neighbors(u)){
        if(!visited[v]&&dist[u]+w<dist[v]){
          dist[v]=dist[u]+w;
          steps.push({dist:[...dist],visited:{...visited},current:u,msg:`Relax ${u}→${v}: dist[${v}]=${dist[v]}`});
        }
      }
    }
    steps.push({dist:[...dist],visited:{...visited},msg:`<span class="hl">Done.</span> Distances: [${dist.join(', ')}]`});
  }
  function draw(){const s=steps[idx];drawDjGraph(viz,s.dist,s.visited,s.current);status.innerHTML=s.msg;}
  function reset(){const s=parseInt(src.value)||0;buildSteps(s);idx=0;draw();}
  reset();
  $('dj-step').addEventListener('click',()=>{if(idx<steps.length-1){idx++;draw();}else{confetti();}});
  $('dj-run').addEventListener('click',async()=>{if(running)return;running=true;reset();while(idx<steps.length-1){idx++;draw();await sleep(parseInt(speed.value));}confetti();running=false;});
  $('dj-reset').addEventListener('click',reset);
}

RENDERERS['hash-tables']=()=>header('Hash Tables','Map keys to array indices via a hash function')+
 expl(`<p>A <strong>hash table</strong> stores key-value pairs in an array of size m. A <strong>hash function</strong> h(k) maps each key to an index in [0, m). Average-case insert/search/delete is O(1).</p>
  <p>When two keys hash to the same index — a <strong>collision</strong> — we need a resolution strategy: chaining (each slot is a list) or open addressing (probe for the next empty slot).</p>`)+
 codeBlock(`#include <iostream>
#include <vector>
#include <list>            // doubly-linked list for the chains
using namespace std;

// Hash table using SEPARATE CHAINING — each bucket holds a linked
// list of (key, value) pairs. Collisions are handled by simply
// appending to the bucket's list.
class HashTable {
    int m;                                    // number of buckets
    vector<list<pair<int,int>>> table;        // m buckets, each a list of pairs

    // Hash function: modulo m. The double-modulo trick '((k%m)+m)%m'
    // returns a non-negative index even for negative keys.
    int hash(int k) { return ((k % m) + m) % m; }
public:
    HashTable(int size) : m(size), table(size) {}   // create m empty buckets

    // INSERT (or update) a key. Average O(1), worst O(n) if all keys collide.
    void insert(int k, int v) {
        for (auto& p : table[hash(k)])        // walk this bucket's chain
            if (p.first == k) { p.second = v; return; }  // key exists → update
        table[hash(k)].push_back({k, v});     // not present → append a new pair
    }

    // LOOKUP by key. Returns -1 if missing (a convention here, since
    // real code would throw or use std::optional).
    int get(int k) {
        for (auto& p : table[hash(k)])
            if (p.first == k) return p.second;
        return -1;
    }

    // DELETE by key. 'remove_if' takes a predicate (here a lambda)
    // and removes every element for which it returns true.
    void remove(int k) {
        table[hash(k)].remove_if([k](auto& p){ return p.first == k; });
    }
};

int main() {
    HashTable t(7);                           // 7 buckets
    t.insert(15, 100); t.insert(22, 200); t.insert(8, 300);
    // 15 % 7 = 1, 22 % 7 = 1 → COLLISION, both end up in bucket 1
    cout << t.get(22);                        // 200
    return 0;
}`)+

RENDERERS['hash-functions']=()=>header('Hash Functions','Modular, Folding, Truncation')+
 expl(`<p>A good <strong>hash function</strong> is fast, deterministic, and distributes keys uniformly. Three classic schemes:</p>
  <p><strong>Modular</strong>: h(k) = k mod m (prefer m prime). <strong>Folding</strong>: split k into chunks, sum them, then mod m. <strong>Truncation</strong>: extract specific digits/bits of k (e.g., middle digits).</p>`)+
 codeBlock(`#include <iostream>
using namespace std;

// MODULAR HASHING — h(k) = k mod m.
// Best when m is PRIME and far from powers of 2 (avoids patterns).
int modular(int k, int m)     { return ((k % m) + m) % m; }  // handle negatives safely

// FOLDING — split the key into equal-sized chunks, sum them, mod m.
// Spreads information from EVERY digit into the hash, which helps when
// keys share a common prefix or suffix.
int folding(int k, int m) {
    int sum = 0;
    while (k > 0) {
        sum += k % 1000;          // grab the last 3 digits
        k /= 1000;                // chop them off
    }
    return sum % m;
}

// TRUNCATION — pick specific digits/bits of the key.
// Fast but information-poor: if the chosen part doesn't vary much,
// you'll get lots of collisions.
int truncation(int k, int m) {
    // Take the middle two digits (assuming k has at least 4 digits).
    // Example: k = 123456 → drop last digit (/10 = 12345) → take last two (%100 = 45).
    return ((k / 10) % 100) % m;
}

int main() {
    int k = 123456, m = 7;
    cout << modular(k, m)    << endl;     // 123456 % 7 = 4
    cout << folding(k, m)    << endl;     // (123 + 456) % 7 = 579 % 7 = 5
    cout << truncation(k, m) << endl;     // 45 % 7 = 3
    return 0;
}`)+

RENDERERS.collisions=()=>header('Collision Resolution','Chaining, Linear Probing, Quadratic Probing')+
 expl(`<p><strong>Chaining</strong>: each slot holds a linked list of entries. Simple, handles arbitrary load.</p>
  <p><strong>Open addressing</strong>: keep one entry per slot; on collision, probe other slots. <strong>Linear probing</strong> uses (h(k)+i) mod m — suffers from primary clustering. <strong>Quadratic probing</strong> uses (h(k)+i²) mod m — reduces clustering but can fail to find an empty slot if the table is more than half full.</p>`)+
 codeBlock(`#include <iostream>
#include <vector>
using namespace std;

// =====================================================================
// LINEAR PROBING — open addressing where on collision we look at the
// NEXT slot: h, h+1, h+2, ... (modulo m). Simple and cache-friendly,
// but suffers from PRIMARY CLUSTERING (long runs of full slots).
// =====================================================================
class LPHash {
    int m;
    vector<int>  tab;             // the table itself
    vector<bool> used;            // is this slot occupied?
public:
    LPHash(int s) : m(s), tab(s, -1), used(s, false) {}

    void insert(int k) {
        int h = k % m;
        for (int i = 0; i < m; i++) {       // at most m probes — table won't grow infinitely
            int idx = (h + i) % m;          // i-th probe: shift by i
            if (!used[idx]) {               // empty slot found → put the key here
                tab[idx] = k;
                used[idx] = true;
                return;
            }
        }
        // (Real code should resize the table here.)
    }

    int find(int k) {
        int h = k % m;
        for (int i = 0; i < m; i++) {
            int idx = (h + i) % m;
            if (!used[idx]) return -1;      // empty slot → key not in table
                                            // (NOTE: if we supported deletion we'd need a
                                            //  "tombstone" marker to keep this search valid.)
            if (tab[idx] == k) return idx;  // found it!
        }
        return -1;
    }
};

// =====================================================================
// QUADRATIC PROBING — probe sequence h, h+1², h+2², h+3², ...
// Spreads collisions farther apart → reduces clustering.
// Caveat: with some m values, not every slot is reachable; the table
// should typically stay below 50% full.
// =====================================================================
class QPHash {
    int m;
    vector<int>  tab;
    vector<bool> used;
public:
    QPHash(int s) : m(s), tab(s, -1), used(s, false) {}

    void insert(int k) {
        int h = k % m;
        for (int i = 0; i < m; i++) {
            int idx = (h + i*i) % m;        // quadratic step: i*i instead of i
            if (!used[idx]) { tab[idx] = k; used[idx] = true; return; }
        }
    }
};

<script>
// ===== PLAYGROUNDS: HASHING =====
function hashTablePg(){
  const viz=$('ht-viz'),status=$('ht-status'),key=$('ht-key');
  const m=7;
  let table=Array.from({length:m},()=>[]);
  function hash(k){return ((k%m)+m)%m;}
  function draw(hl,hlPink){
    let html='<div class="hash-table">';
    for(let i=0;i<m;i++){
      const cls=i===hl?'hash-bucket hl':(i===hlPink?'hash-bucket hl-pink':'hash-bucket');
      html+=`<div class="hash-idx">${i}</div><div class="${cls}">`+
        (table[i].length?table[i].map(k=>`<span class="hash-item">${k}</span>`).join(''):'<span style="color:var(--text-dim);font-size:0.8rem">empty</span>')+'</div>';
    }
    html+='</div>';viz.innerHTML=html;
  }
  draw();
  $('ht-ins').addEventListener('click',async()=>{const k=parseInt(key.value);if(isNaN(k))return;const h=hash(k);draw(h);await sleep(300);if(!table[h].includes(k))table[h].push(k);draw(-1,h);status.innerHTML=`Inserted <span class="hl">${k}</span> at index ${h}`;});
  $('ht-find').addEventListener('click',async()=>{const k=parseInt(key.value);if(isNaN(k))return;const h=hash(k);draw(h);await sleep(400);if(table[h].includes(k)){draw(-1,h);status.innerHTML=`Found <span class="hl">${k}</span> at index ${h}`;confetti();}else{draw();status.textContent=`${k} not found`;}});
  $('ht-rm').addEventListener('click',()=>{const k=parseInt(key.value);if(isNaN(k))return;const h=hash(k);table[h]=table[h].filter(x=>x!==k);draw();status.innerHTML=`Deleted <span class="hl">${k}</span>`;});
  $('ht-reset').addEventListener('click',()=>{table=Array.from({length:m},()=>[]);draw();status.textContent='Reset.';});
}

function hashFnPg(){
  const viz=$('hf-viz'),status=$('hf-status');
  function compute(){
    const k=parseInt($('hf-key').value);const m=parseInt($('hf-m').value);
    if(isNaN(k)||isNaN(m)||m<=0){status.textContent='Invalid input.';return;}
    const mod=((k%m)+m)%m;
    let sum=0,kk=k;while(kk>0){sum+=kk%1000;kk=Math.floor(kk/1000);}const fold=sum%m;
    const trunc=Math.floor(k/10)%100%m;
    viz.innerHTML=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;padding:10px">
      <div class="card" style="margin:0;text-align:center;padding:16px"><h2 style="margin-bottom:8px">Modular</h2><div style="font-family:monospace;color:var(--text-dim);margin-bottom:8px">${k} mod ${m}</div><div style="font-size:2rem;color:var(--accent-cyan);font-weight:600">${mod}</div></div>
      <div class="card" style="margin:0;text-align:center;padding:16px"><h2 style="margin-bottom:8px">Folding</h2><div style="font-family:monospace;color:var(--text-dim);margin-bottom:8px">(${sum}) mod ${m}</div><div style="font-size:2rem;color:var(--accent-purple);font-weight:600">${fold}</div></div>
      <div class="card" style="margin:0;text-align:center;padding:16px"><h2 style="margin-bottom:8px">Truncation</h2><div style="font-family:monospace;color:var(--text-dim);margin-bottom:8px">middle2 mod ${m}</div><div style="font-size:2rem;color:var(--accent-pink);font-weight:600">${trunc}</div></div>
     </div>`;
    status.innerHTML=`Hashed <span class="hl">${k}</span> with m=${m}`;
  }
  compute();
  $('hf-run').addEventListener('click',compute);
}

function collisionsPg(){
  const viz=$('cr-viz'),status=$('cr-status'),key=$('cr-key'),mode=$('cr-mode');
  const m=11;
  let chain=Array.from({length:m},()=>[]);
  let lin=Array(m).fill(null);
  let quad=Array(m).fill(null);
  function draw(hl,hlPink){
    const md=mode.value;let arr;
    if(md==='chain'){
      let html='<div class="hash-table">';
      for(let i=0;i<m;i++){
        const cls=i===hl?'hash-bucket hl':(i===hlPink?'hash-bucket hl-pink':'hash-bucket');
        html+=`<div class="hash-idx">${i}</div><div class="${cls}">`+
          (chain[i].length?chain[i].map(k=>`<span class="hash-item">${k}</span>`).join(''):'<span style="color:var(--text-dim);font-size:0.8rem">empty</span>')+'</div>';
      }
      html+='</div>';viz.innerHTML=html;
    }else{
      arr=md==='linear'?lin:quad;
      let html='<div class="hash-table">';
      for(let i=0;i<m;i++){
        const cls=i===hl?'hash-bucket hl':(i===hlPink?'hash-bucket hl-pink':'hash-bucket');
        html+=`<div class="hash-idx">${i}</div><div class="${cls}">`+
          (arr[i]!=null?`<span class="hash-item">${arr[i]}</span>`:'<span style="color:var(--text-dim);font-size:0.8rem">empty</span>')+'</div>';
      }
      html+='</div>';viz.innerHTML=html;
    }
  }
  draw();
  async function insert(){
    const k=parseInt(key.value);if(isNaN(k))return;
    const md=mode.value;const h=((k%m)+m)%m;
    if(md==='chain'){
      draw(h);await sleep(400);
      if(!chain[h].includes(k))chain[h].push(k);
      draw(-1,h);status.innerHTML=`Inserted <span class="hl">${k}</span> at ${h} (chained)`;return;
    }
    const arr=md==='linear'?lin:quad;
    for(let i=0;i<m;i++){
      const idx=md==='linear'?(h+i)%m:(h+i*i)%m;
      draw(idx);await sleep(350);
      if(arr[idx]==null){arr[idx]=k;draw(-1,idx);status.innerHTML=`Inserted <span class="hl">${k}</span> at ${idx} (probe ${i})`;return;}
      if(arr[idx]===k){status.textContent='Already present.';return;}
    }
    status.textContent='Table full!';
  }
  async function find(){
    const k=parseInt(key.value);if(isNaN(k))return;
    const md=mode.value;const h=((k%m)+m)%m;
    if(md==='chain'){draw(h);await sleep(400);if(chain[h].includes(k)){draw(-1,h);status.innerHTML=`Found <span class="hl">${k}</span>`;confetti();}else{draw();status.textContent='Not found';}return;}
    const arr=md==='linear'?lin:quad;
    for(let i=0;i<m;i++){
      const idx=md==='linear'?(h+i)%m:(h+i*i)%m;
      draw(idx);await sleep(350);
      if(arr[idx]==null){draw();status.textContent='Not found';return;}
      if(arr[idx]===k){draw(-1,idx);status.innerHTML=`Found <span class="hl">${k}</span> at ${idx}`;confetti();return;}
    }
    status.textContent='Not found';
  }
  function reset(){chain=Array.from({length:m},()=>[]);lin=Array(m).fill(null);quad=Array(m).fill(null);draw();status.textContent='Reset.';}
  $('cr-ins').addEventListener('click',insert);
  $('cr-find').addEventListener('click',find);
  $('cr-reset').addEventListener('click',reset);
  mode.addEventListener('change',()=>{draw();status.textContent='Strategy: '+mode.options[mode.selectedIndex].text;});
}
</script>
